<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopLink – Discounted deals from Daraz</title>
<style id="app-style">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#ffffff;--soft:#f3f7fd;--ink:#13233f;--muted:#5b6a82;--line:#e1e8f3;--blue:#2563eb;--blue-d:#1d4ed8;--blue-s:#e8f0fe;--red:#e0414b;--star:#f59e0b;
--font:"Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.hdr-in{position:relative;max-width:1080px;margin:0 auto;padding:10px 14px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand menu" "search search";gap:10px;align-items:center}
.brand{grid-area:brand;justify-self:start;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
#menuBtn{grid-area:menu}
.icon-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.search{grid-area:search;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:0 14px 0 40px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-s)}
.menu{position:absolute;right:14px;top:calc(100% + 4px);width:220px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(19,35,63,.14);padding:6px;z-index:30}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;font-size:15px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
@media(min-width:720px){
  .hdr-in{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand search menu";gap:18px}
  .search{max-width:560px;width:100%;justify-self:center}
}

/* categories */
.chips{max-width:1080px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.chip:hover{background:var(--soft)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}

/* products */
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 12px}
.sec-head h2{margin:0;font-size:19px}
.muted{color:var(--muted)}
.sec-head .muted{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.thumb{position:relative;aspect-ratio:1/1;background:#fff;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:46px;background:var(--blue-s)}
.off{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;line-height:1.3}
.tag{position:absolute;right:8px;top:8px;background:rgba(19,35,63,.72);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.cbody{display:flex;flex-direction:column;gap:5px;padding:10px 11px 12px;flex:1}
.name{margin:0;font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.desc{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}
.price b{font-size:17px;font-weight:700;color:var(--blue)}
.price s{font-size:12.5px;color:var(--muted)}
.rate{font-size:12.5px;color:var(--muted);min-height:1.4em}
.rate i{font-style:normal;color:var(--star)}
.buy{margin-top:auto;display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;font-weight:600;font-size:14.5px;padding:11px 10px;border-radius:12px}
.buy:hover{background:var(--blue-d)}
.empty{grid-column:1/-1;text-align:center;padding:34px 14px;color:var(--muted);background:var(--soft);border-radius:16px}
.empty p{margin:0 0 12px}

/* why */
.why{margin:30px 0 0;padding:18px 16px;background:var(--soft);border:1px solid var(--line);border-radius:18px}
.why h2{margin:0 0 12px;font-size:19px}
.why ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.why li{display:flex;gap:10px;align-items:flex-start}
.why li svg{flex:none;margin-top:3px}
.why .note{margin:14px 0 0;font-size:13px;color:var(--muted)}

/* footer */
.ftr{margin-top:34px;border-top:1px solid var(--line);padding:22px 0 26px}
.ftr-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.ftr-links{display:flex;flex-wrap:wrap;gap:4px 18px;margin:14px 0}
.ftr-links button{background:none;border:0;padding:5px 0;font-size:14px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.disc{margin:0 0 8px;font-size:13px;color:var(--muted)}
.copy{margin:0;font-size:12px;color:var(--muted)}

/* buttons */
.btn{height:44px;padding:0 18px;border-radius:12px;background:var(--blue);color:#fff;border:1px solid var(--blue);font-weight:600;font-size:15px;line-height:1}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border-color:#c8d7f6}
.btn.ghost:hover{background:var(--blue-s)}
.btn.danger{background:#fff;color:#c62f39;border-color:#f1c4c7}
.btn.danger:hover{background:#fdecee}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:default}

/* modals */
.ov{position:fixed;inset:0;z-index:50;background:rgba(19,35,63,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:#fff;border-radius:22px;width:100%;max-width:420px;max-height:100%;overflow:auto;padding:24px 20px 20px;box-shadow:0 20px 60px rgba(19,35,63,.28)}
.dlg h2{margin:0 0 12px;font-size:21px;line-height:1.3}
.dlg p{margin:0 0 10px;color:var(--ink)}
.dlg-logo{margin-bottom:12px}
.wl{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:12px}
.wl li{display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.wl .em{flex:none;width:34px;height:34px;border-radius:10px;background:var(--blue-s);display:flex;align-items:center;justify-content:center;font-size:18px}
.dlg-btns{display:flex;gap:10px;margin-top:16px}
.dlg-btns .btn{flex:1}
.ov.sheetov{padding:0;align-items:stretch}
.sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:720px){.ov.sheetov{padding:24px;align-items:center}.sheet{border-radius:20px;max-height:100%}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line)}
@media(min-width:720px){.sheet-head{padding-top:12px}}
.sheet-head h2{margin:0;font-size:18px}
.sheet-body{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
@media(min-width:720px){.sheet-foot{padding-bottom:12px}}
#app.busy .sheet{opacity:.65;pointer-events:none}

/* admin */
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.adm-list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.row .rt{width:52px;height:52px;flex:none;border-radius:10px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.row .rt img{width:100%;height:100%;object-fit:contain}
.row .rt .ph{font-size:24px}
.row .ri{flex:1;min-width:0}
.row .rn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{font-size:12.5px;color:var(--muted)}
.row .ra{display:flex;gap:6px;flex:none}
.note-box{margin-top:14px;padding:12px;border-radius:12px;background:var(--blue-s);font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.adm-set{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.inl{display:flex;gap:8px}
.inl input{flex:1;min-width:0}

/* form */
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;padding:0 12px;height:44px}
.field textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inl input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
.inl input{border:1px solid var(--line);border-radius:10px;height:36px;padding:0 12px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.imgrow{display:flex;gap:12px;align-items:center}
.imgprev{width:92px;height:92px;flex:none;border:1px dashed #b8c8e6;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center}
.imgprev img{width:100%;height:100%;object-fit:contain;background:#fff}
.imgbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hint.tight{margin:-6px 0 14px}
.err{margin:0;min-height:1.3em;color:#c62f39;font-size:13.5px;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px}
</style>
</head>

<script id="app-code">
(function(){
'use strict';

var CATS=[['Electronics','📱'],['Fashion','👗'],['Home & Living','🏠'],['Beauty','💄'],['Gadgets','⌚'],['Others','📦']];
var EMOJI={};CATS.forEach(function(c){EMOJI[c[0]]=c[1]});

var DATA;
try{DATA=JSON.parse(document.getElementById('shop-data').textContent)}catch(e){DATA={}}
DATA.products=DATA.products||[];
DATA.settings=DATA.settings||{email:''};

var S={cat:'All',q:'',canEdit:false,busy:false,editId:null,draftImg:'',discTouched:false,modals:[],cfn:null};

function $(s,r){return (r||document).querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function money(n){return '৳'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function calcDisc(price,old){return old>price?Math.round((1-price/old)*100):0}
function find(id){for(var i=0;i<DATA.products.length;i++){if(DATA.products[i].id===id)return DATA.products[i]}return null}

/* browser storage (always guarded) */
function lget(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function lset(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function sget(k){try{return window.sessionStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{window.sessionStorage.setItem(k,v)}catch(e){}}
function sdel(k){try{window.sessionStorage.removeItem(k)}catch(e){}}

var I={
  logo:function(n){return '<svg width="'+n+'" height="'+n+'" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2563eb"/><path d="M9.5 12.5h13l-1 11h-11z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M12.5 12.5v-1a3.5 3.5 0 0 1 7 0v1" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>'},
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  menu:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};

var INFO={
  about:['About Us',[
    'ShopLink is a small deal-discovery website. We gather discounted products from Daraz in one place so you can browse them quickly.',
    'We do not sell products or take payments. When you press “Buy on Daraz”, you finish your purchase on Daraz.',
    'ShopLink is an independent website. Daraz is a trademark of its respective owner.'
  ]],
  contact:['Contact Us',[]],
  privacy:['Privacy Policy',[
    'ShopLink does not ask you to create an account and does not collect your name, phone number or address.',
    'Your browser may keep a small note on your own device, for example that you have already seen the welcome screen. It stays on your device.',
    'When you press “Buy on Daraz”, you leave ShopLink and go to Daraz. Daraz and its affiliate program may use cookies to record the visit, and Daraz’s own privacy policy applies there.',
    'If this policy changes, the new version will appear on this page.'
  ]],
  terms:['Terms & Conditions',[
    'ShopLink shares product information for general guidance only. Prices, discounts, ratings and availability come from Daraz and its sellers and can change at any time.',
    'Please check the final price, delivery cost and return policy on Daraz before you buy.',
    'ShopLink is not the seller. Orders, payments, delivery, returns and refunds are handled by Daraz and its sellers.',
    'We may change or remove products, and these terms, at any time.'
  ]],
  disclosure:['Affiliate Disclosure',[
    'Some links on this website are affiliate links. If you purchase a product through these links, we may receive a commission at no additional cost to you.'
  ]]
};

/* ---------- layout ---------- */
function shell(){
  $('#app').innerHTML=
  '<header class="hdr"><div class="hdr-in">'+
    '<button class="brand" data-act="home" aria-label="ShopLink home">'+I.logo(32)+'<span>ShopLink</span></button>'+
    '<div class="search" role="search">'+I.search+'<input id="q" type="search" placeholder="Search products…" autocomplete="off" aria-label="Search products"></div>'+
    '<button class="icon-btn" id="menuBtn" data-act="menu" aria-label="Menu" aria-expanded="false" aria-controls="menu">'+I.menu+'</button>'+
    '<nav class="menu" id="menu" hidden></nav>'+
  '</div></header>'+
  '<main>'+
    '<section aria-label="Categories"><div class="chips" id="chips"></div></section>'+
    '<section class="wrap" id="deals"><div class="sec-head"><h2>Featured Products</h2><span class="muted" id="count"></span></div><div class="grid" id="grid"></div></section>'+
    '<section class="wrap" id="why"><div class="why"><h2>Why use ShopLink?</h2><ul>'+
      ['Find good deals easily','Discover discounted products','Compare products and prices more easily','Find useful products in one place','Click Buy on Daraz to complete the purchase'].map(function(t){return '<li>'+I.check+'<span>'+t+'</span></li>'}).join('')+
    '</ul><p class="note">Prices and availability can change on Daraz. Please check the final price on Daraz before you buy.</p></div></section>'+
  '</main>'+
  '<footer class="ftr"><div class="wrap">'+
    '<div class="ftr-brand">'+I.logo(28)+'<span>ShopLink</span></div>'+
    '<nav class="ftr-links" aria-label="Footer">'+
      [['about','About Us'],['contact','Contact Us'],['privacy','Privacy Policy'],['terms','Terms & Conditions'],['disclosure','Affiliate Disclosure']].map(function(l){return '<button data-act="info" data-k="'+l[0]+'">'+esc(l[1])+'</button>'}).join('')+
    '</nav>'+
    '<p class="disc">Some links on this website are affiliate links. If you purchase a product through these links, we may receive a commission at no additional cost to you.</p>'+
    '<p class="copy">© '+new Date().getFullYear()+' ShopLink. An independent website — Daraz is a trademark of its respective owner.</p>'+
  '</div></footer>';
}

function renderMenu(){
  $('#menu').innerHTML=
    '<button data-act="home">Home</button>'+
    '<button data-act="why">Why ShopLink?</button>'+
    '<button data-act="info" data-k="contact">Contact Us</button>'+
    (S.canEdit?'<hr><button data-act="admin-open">Manage products</button>':'');
}
function closeMenu(){var m=$('#menu');if(m){m.hidden=true}var b=$('#menuBtn');if(b)b.setAttribute('aria-expanded','false')}
function toggleMenu(){var m=$('#menu');var open=m.hidden;m.hidden=!open;$('#menuBtn').setAttribute('aria-expanded',open?'true':'false')}

function renderChips(){
  var all=[['All','']].concat(CATS);
  $('#chips').innerHTML=all.map(function(c){
    return '<button class="chip" data-act="cat" data-c="'+esc(c[0])+'" aria-pressed="'+(S.cat===c[0])+'">'+(c[1]?c[1]+' ':'')+esc(c[0])+'</button>';
  }).join('');
}

function filtered(){
  var q=S.q.trim().toLowerCase();
  return DATA.products.filter(function(p){
    if(S.cat!=='All'&&p.cat!==S.cat)return false;
    if(!q)return true;
    return (p.name+' '+(p.desc||'')+' '+p.cat).toLowerCase().indexOf(q)>-1;
  });
}

function card(p){
  var img=p.image?'<img src="'+p.image+'" alt="'+esc(p.name)+'" loading="lazy" decoding="async">':'<div class="ph" aria-hidden="true">'+(EMOJI[p.cat]||'🛍️')+'</div>';
  var url=/^https?:\/\//i.test(p.url||'')?p.url:'#';
  return '<article class="card"><div class="thumb">'+img+
    (p.discount>0?'<span class="off">-'+p.discount+'%</span>':'')+
    (p.demo?'<span class="tag">Demo</span>':'')+'</div>'+
    '<div class="cbody"><h3 class="name">'+esc(p.name)+'</h3>'+
    '<p class="desc">'+esc(p.desc||'')+'</p>'+
    '<div class="price"><b>'+money(p.price)+'</b>'+(p.oldPrice>p.price?'<s>'+money(p.oldPrice)+'</s>':'')+'</div>'+
    '<div class="rate">'+(p.rating>0?'<i aria-hidden="true">★</i> <span aria-label="Rated '+p.rating+' out of 5">'+p.rating+'</span>':'')+'</div>'+
    '<a class="buy" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer sponsored nofollow">Buy on Daraz</a>'+
    '</div></article>';
}

function renderGrid(){
  var list=filtered();
  $('#count').textContent=list.length+(list.length===1?' product':' products');
  if(list.length){$('#grid').innerHTML=list.map(card).join('');return}
  if(!DATA.products.length){
    $('#grid').innerHTML='<div class="empty"><p>No products yet.</p>'+(S.canEdit?'<p>Open the menu and choose Manage products to add your first one.</p>':'<p>Please check back soon.</p>')+'</div>';
  }else{
    $('#grid').innerHTML='<div class="empty"><p>No products match your search.</p><button class="btn ghost sm" data-act="reset">Show all products</button></div>';
  }
}

/* ---------- modals ---------- */
function openModal(html,cls,lock){
  var el=document.createElement('div');
  el.className='ov '+(cls||'');
  if(lock)el.setAttribute('data-lock','1');
  el.innerHTML=html;
  $('#app').appendChild(el);
  S.modals.push(el);
  document.documentElement.classList.add('lock');
  var f=el.querySelector('[data-focus]');if(f)f.focus();
  return el;
}
function closeModal(el){
  if(!el)return;
  var i=S.modals.indexOf(el);if(i>-1)S.modals.splice(i,1);
  if(el.parentNode)el.parentNode.removeChild(el);
  if(!S.modals.length)document.documentElement.classList.remove('lock');
}
var toastT;
function notify(msg,ms){
  var t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');$('#app').appendChild(t)}
  t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);
  if(ms!==0)toastT=setTimeout(function(){t.hidden=true},ms||4000);
}

function showInfo(k){
  var d=INFO[k];if(!d)return;
  var body;
  if(k==='contact'){
    var em=(DATA.settings&&DATA.settings.email)||'';
    body=(em?'<p>Questions about ShopLink? Email us at <a href="mailto:'+esc(em)+'">'+esc(em)+'</a>.</p>':'<p>Our contact details will be added soon.</p>')+
      '<p>For orders, delivery or returns, please contact Daraz directly.</p>';
  }else{
    body=d[1].map(function(t){return '<p>'+esc(t)+'</p>'}).join('');
  }
  openModal('<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="it"><h2 id="it">'+esc(d[0])+'</h2>'+body+
    '<div class="dlg-btns"><button class="btn" data-act="modal-close" data-focus>Close</button></div></div>','');
}

function confirmBox(title,text,okLabel,fn){
  S.cfn=fn;
  openModal('<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="ct"><h2 id="ct">'+esc(title)+'</h2><p>'+esc(text)+'</p>'+
    '<div class="dlg-btns"><button class="btn ghost" data-act="c-no" data-focus>Cancel</button><button class="btn danger" data-act="c-yes">'+esc(okLabel)+'</button></div></div>','');
}

/* ---------- welcome ---------- */
function maybeWelcome(){
  if(lget('shoplink_seen')||sget('shoplink_seen')||sget('shoplink_admin'))return;

  lset('shoplink_seen','1');sset('shoplink_seen','1');

/* ---------- admin ---------- */
function adminBody(){
  var rows=DATA.products.map(function(p){
    var th=p.image?'<img src="'+p.image+'" alt="">':'<div class="ph" aria-hidden="true">'+(EMOJI[p.cat]||'🛍️')+'</div>';
    return '<div class="row"><div class="rt">'+th+'</div><div class="ri"><div class="rn">'+esc(p.name)+(p.demo?' (demo)':'')+'</div><div class="rm">'+esc(p.cat)+' · '+money(p.price)+'</div></div>'+
      '<div class="ra"><button class="btn ghost sm" data-act="p-edit" data-id="'+esc(p.id)+'">Edit</button><button class="btn danger sm" data-act="p-del" data-id="'+esc(p.id)+'">Delete</button></div></div>';
  }).join('');
  var hasDemo=DATA.products.some(function(p){return p.demo});
  return '<div class="adm-top"><button class="btn" data-act="p-add">+ Add product</button><span class="muted">'+DATA.products.length+(DATA.products.length===1?' product':' products')+'</span></div>'+
    '<div class="adm-list">'+(rows||'<p class="muted">No products yet. Add your first product.</p>')+'</div>'+
    (hasDemo?'<div class="note-box"><span>Products marked Demo are samples with made-up prices. Edit them or remove them all.</span><button class="btn danger sm" data-act="demo-clear">Remove demo products</button></div>':'')+
    '<div class="adm-set"><div class="field"><label for="sEmail">Contact email (shown on Contact Us)</label><div class="inl"><input id="sEmail" type="email" placeholder="you@example.com" value="'+esc(DATA.settings.email||'')+'"><button class="btn sm" data-act="email-save">Save</button></div></div></div>';
}
function openAdmin(){
  openModal('<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="at"><div class="sheet-head"><h2 id="at">Manage products</h2><button class="icon-btn" data-act="modal-close" aria-label="Close">'+I.close+'</button></div><div class="sheet-body" id="adminBody">'+adminBody()+'</div></div>','sheetov',true);
}
function refreshAdmin(){var b=$('#adminBody');if(b)b.innerHTML=adminBody()}

function renderPrev(){
  var el=$('#fPrev');if(!el)return;
  el.innerHTML=S.draftImg?'<img src="'+S.draftImg+'" alt="">':'No image';
}

function openForm(id){
  var p=id?find(id):null;
  S.editId=p?p.id:null;
  S.draftImg=p?(p.image||''):'';
  S.discTouched=!!(p&&p.oldPrice>p.price&&p.discount!==calcDisc(p.price,p.oldPrice));
  var v=function(x){return esc(x==null?'':x)};
  var cats=CATS.map(function(c){return '<option'+(p&&p.cat===c[0]?' selected':'')+'>'+esc(c[0])+'</option>'}).join('');
  openModal('<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ft">'+
    '<div class="sheet-head"><h2 id="ft">'+(p?'Edit product':'Add product')+'</h2><button class="icon-btn" data-act="p-cancel" aria-label="Close">'+I.close+'</button></div>'+
    '<div class="sheet-body">'+
      '<div class="field"><label>Product image</label><div class="imgrow"><div class="imgprev" id="fPrev"></div><div class="imgbtns"><button class="btn ghost sm" type="button" data-act="img-pick">Choose image</button><button class="btn ghost sm" type="button" data-act="img-remove">Remove image</button></div></div>'+
      '<input type="file" id="fImg" accept="image/*" hidden><p class="hint">Pick a photo from your phone or computer. It is resized automatically so the site stays fast.</p></div>'+
      '<div class="field"><label for="fName">Product name</label><input id="fName" maxlength="120" value="'+v(p&&p.name)+'" autocomplete="off"></div>'+
      '<div class="field"><label for="fDesc">Short description</label><textarea id="fDesc" maxlength="160">'+esc(p?p.desc:'')+'</textarea></div>'+
      '<div class="row2"><div class="field"><label for="fCur">Current price (৳)</label><input id="fCur" type="number" inputmode="decimal" min="0" step="any" value="'+v(p&&p.price)+'"></div>'+
      '<div class="field"><label for="fOld">Previous price (৳)</label><input id="fOld" type="number" inputmode="decimal" min="0" step="any" value="'+v(p&&p.oldPrice>0?p.oldPrice:'')+'"></div></div>'+
      '<div class="row2"><div class="field"><label for="fDisc">Discount (%)</label><input id="fDisc" type="number" inputmode="numeric" min="0" max="95" step="1" value="'+v(p&&p.discount>0?p.discount:'')+'"></div>'+
      '<div class="field"><label for="fRate">Rating (0–5)</label><input id="fRate" type="number" inputmode="decimal" min="0" max="5" step="0.1" value="'+v(p&&p.rating>0?p.rating:'')+'"></div></div>'+
      '<p class="hint tight">Discount is worked out from the two prices. You can type your own.</p>'+
      '<div class="field"><label for="fCat">Category</label><select id="fCat">'+cats+'</select></div>'+
      '<div class="field"><label for="fUrl">Daraz affiliate URL</label><input id="fUrl" type="url" inputmode="url" placeholder="https://…" value="'+v(p&&p.url)+'" autocomplete="off"></div>'+
      '<p class="err" id="fErr" role="alert"></p>'+
    '</div>'+
    '<div class="sheet-foot"><button class="btn ghost" data-act="p-cancel">Cancel</button><button class="btn" data-act="p-save">Save product</button></div></div>','sheetov',true);
  renderPrev();
}

function submitForm(){
  if(S.busy)return;
  var g=function(i){return $('#'+i).value};
  var fe=$('#fErr');
  var err=function(m){fe.textContent=m;fe.scrollIntoView({block:'nearest'})};
  var name=g('fName').trim(),desc=g('fDesc').trim(),price=parseFloat(g('fCur')),old=parseFloat(g('fOld')),disc=parseFloat(g('fDisc')),rate=parseFloat(g('fRate')),cat=g('fCat'),url=g('fUrl').trim();
  fe.textContent='';
  if(!name)return err('Enter the product name.');
  if(!(price>0))return err('Enter the current price.');
  if(!isNaN(old)&&old<=price)return err('Previous price must be higher than the current price, or leave it empty.');
  if(isNaN(disc))disc=(old>price)?calcDisc(price,old):0;
  if(disc<0||disc>95)return err('Discount must be between 0 and 95.');
  if(!isNaN(rate)&&(rate<0||rate>5))return err('Rating must be between 0 and 5.');
  if(!/^https?:\/\/\S+$/i.test(url))return err('Paste the full Daraz affiliate link, starting with https://');
  var rec={id:S.editId||uid(),name:name,desc:desc,price:price,oldPrice:old>price?old:0,discount:Math.round(disc),rating:isNaN(rate)?0:Math.round(rate*10)/10,cat:cat,url:url,image:S.draftImg||''};
  var editId=S.editId;
  save(function(){
    if(editId){DATA.products=DATA.products.map(function(p){return p.id===editId?rec:p})}
    else{DATA.products.unshift(rec)}
  });
}

/* ---------- images ---------- */
function readFile(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(f)})}
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){rej(new Error('img'))};i.src=src})}
function compress(file){
  return readFile(file).then(loadImg).then(function(img){
    var max=640,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
    w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
    var c=document.createElement('canvas');c.width=w;c.height=h;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    var q=0.74,out=c.toDataURL('image/jpeg',q);
    while(out.length>260000&&q>0.4){q-=0.1;out=c.toDataURL('image/jpeg',q)}
    return out;
  });
}

/* ---------- saving (the page republishes itself) ---------- */
function buildDoc(){
  var css=document.getElementById('app-style').textContent;
  var code=document.getElementById('app-code').textContent;
  var json=JSON.stringify(DATA).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>ShopLink – Discounted deals from Daraz</title>\n'+
    '<style id="app-style">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n'+
    '<script type="application/json" id="shop-data">'+json+'<\/script>\n'+
    '<script id="app-code">'+code+'<\/script>\n</body>\n</html>\n';
}
function publish(){
  if(!window.claude||!window.claude.use)return Promise.reject({code:'not_granted'});
  return window.claude.use('artifact').then(function(art){
    if(!art)throw {code:'not_granted'};
    var html=buildDoc();
    if(html.length>15000000)throw {code:'too_large'};
    sset('shoplink_admin','1');
    return art.publish(html);
  });
}
function errText(e){
  switch(e&&e.code){
    case 'not_writer':case 'not_granted':case 'consent_required':case 'capability_disabled':case 'capability_removed':case 'not_declared':
      return 'Saving is not available in this view. Open the site while signed in as its owner.';
    case 'too_large':return 'The site is too large. Remove a few images or products and try again.';
    case 'rate_limited':return 'Too many saves in a row. Wait a minute and try again.';
    default:return 'Could not save. Check your connection and try again.';
  }
}
function setBusy(b){S.busy=b;$('#app').classList.toggle('busy',b)}
function save(mutate){
  if(S.busy)return;
  var before=JSON.stringify(DATA);
  mutate();
  setBusy(true);notify('Saving…',0);
  publish().then(function(){
    /* the page normally reloads here; this is only a fallback */
    setTimeout(function(){
      if(S.busy){setBusy(false);renderGrid();refreshAdmin();notify('Saved. Reload the page to see the update.',6000)}
    },6000);
  },function(err){
    DATA=JSON.parse(before);
    setBusy(false);sdel('shoplink_admin');
    if(err&&err.code==='conflict'){notify('The site was updated somewhere else. Reloading…');return}
    notify(errText(err),6000);
  });
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('ov')&&!el.hasAttribute('data-lock')){closeModal(el);return}
  if(!el.closest('#menu')&&!el.closest('#menuBtn'))closeMenu();
  var t=el.closest('[data-act]');
  if(!t)return;
  var a=t.getAttribute('data-act');
  if(a!=='menu')closeMenu();
  switch(a){
    case 'menu':toggleMenu();break;
    case 'home':S.cat='All';S.q='';$('#q').value='';renderChips();renderGrid();window.scrollTo(0,0);break;
    case 'why':$('#why').scrollIntoView();break;
    case 'cat':S.cat=t.getAttribute('data-c');renderChips();renderGrid();break;
    case 'reset':S.cat='All';S.q='';$('#q').value='';renderChips();renderGrid();break;
    case 'info':showInfo(t.getAttribute('data-k'));break;
    case 'modal-close':closeModal(t.closest('.ov'));break;
    case 'w-go':dismissWelcome();$('#deals').scrollIntoView();break;
    case 'w-skip':dismissWelcome();break;
    case 'admin-open':openAdmin();break;
    case 'p-add':openForm(null);break;
    case 'p-edit':openForm(t.getAttribute('data-id'));break;
    case 'p-cancel':closeModal(t.closest('.ov'));break;
    case 'p-save':submitForm();break;
    case 'img-pick':$('#fImg').click();break;
    case 'img-remove':S.draftImg='';renderPrev();break;
    case 'p-del':
      var id=t.getAttribute('data-id'),p=find(id);
      if(p)confirmBox('Delete this product?','“'+p.name+'” will be removed from ShopLink.','Delete',function(){
        save(function(){DATA.products=DATA.products.filter(function(x){return x.id!==id})});
      });
      break;
    case 'demo-clear':
      confirmBox('Remove demo products?','All sample products will be removed. Your own products stay.','Remove',function(){
        save(function(){DATA.products=DATA.products.filter(function(x){return !x.demo})});
      });
      break;
    case 'email-save':
      var v=$('#sEmail').value.trim();
      if(v&&!/^\S+@\S+\.\S+$/.test(v)){notify('Enter a valid email address.');break}
      save(function(){DATA.settings.email=v});
      break;
    case 'c-no':closeModal(t.closest('.ov'));S.cfn=null;break;
    case 'c-yes':var fn=S.cfn;S.cfn=null;closeModal(t.closest('.ov'));if(fn)fn();break;
  }
});

document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q'){S.q=e.target.value;renderGrid()}
  else if(id==='fCur'||id==='fOld'){
    if(!S.discTouched){
      var c=parseFloat($('#fCur').value),o=parseFloat($('#fOld').value);
      $('#fDisc').value=(c>0&&o>c)?calcDisc(c,o):'';
    }
  }
  else if(id==='fDisc'){S.discTouched=e.target.value!==''}
});

document.addEventListener('change',function(e){
  if(e.target.id==='fImg'&&e.target.files&&e.target.files[0]){
    var f=e.target.files[0];
    compress(f).then(function(d){S.draftImg=d;renderPrev()},function(){notify('That image could not be read. Try a JPG or PNG photo.')});
    e.target.value='';
  }
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  var m=$('#menu');
  if(m&&!m.hidden){closeMenu();return}
  var top=S.modals[S.modals.length-1];
  if(!top||S.busy)return;
  if(top.classList.contains('welcome'))dismissWelcome();else closeModal(top);
});

/* ---------- owner check (admin appears only for people who can edit) ---------- */
function initOwner(){
  try{
    if(!window.claude||!window.claude.use)return;
    window.claude.use('user').then(function(u){
      return u?u.canEdit():false;
    }).then(function(ok){
      if(!ok)return;
      S.canEdit=true;renderMenu();
      if(!DATA.products.length)renderGrid();
      if(sget('shoplink_admin')){sdel('shoplink_admin');openAdmin()}
    }).catch(function(){});
  }catch(e){}
}

shell();renderMenu();renderChips();renderGrid();maybeWelcome();initOwner();
})();
</script>
